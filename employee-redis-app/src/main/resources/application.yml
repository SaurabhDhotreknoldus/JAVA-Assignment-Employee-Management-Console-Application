server:
  port: 8080

spring:
  application:
    name: employee-redis-app

  # Database Persistence Configuration (H2 in-memory)
  datasource:
    url: jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  # Spring Cache Configuration
  cache:
    type: redis

# Custom Application Cache Settings
app:
  cache:
    name: employees
    # Default TTL (Time-To-Live) in seconds: 300s (5 minutes)
    ttl-seconds: 300

logging:
  level:
    com.nashtech.redisapp: DEBUG
    org.springframework.cache: TRACE
    org.springframework.data.redis: DEBUG

